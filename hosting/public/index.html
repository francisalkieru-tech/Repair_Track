<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your repair</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7f9;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;color:#111}
  .card{background:#fff;border-radius:16px;padding:28px;max-width:360px;margin:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
  .id{font-size:28px;letter-spacing:3px;font-weight:700;margin:12px 0}
  a.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:600;margin-top:8px}
  p{color:#555;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1 style="font-size:20px;margin:0 0 4px">Track your repair</h1>
  <p id="msg">Open this link on a phone that has the RepairTrack app.</p>
  <div class="id" id="id"></div>
  <a class="btn" id="open" href="#">Open in RepairTrack app</a>
  <p style="font-size:13px">No app yet? Install RepairTrack, then tap this link again, or type the tracking ID above on the app's Track screen.</p>
</div>
<script>
(function () {
  var m = location.pathname.match(/^\/track\/([A-Za-z0-9]{8})\/?$/);
  var id = m ? m[1].toUpperCase() : '';
  if (!id) {
    document.getElementById('msg').textContent = 'This tracking link is not valid.';
    document.getElementById('open').style.display = 'none';
    return;
  }
  document.getElementById('id').textContent = id;
  document.getElementById('open').href = 'repairtrack://track/' + id;
})();
</script>
</body>
</html>
